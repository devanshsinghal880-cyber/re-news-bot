name: Daily News

on:
  schedule:
    - cron: "30 1 * * *"   # roz 7:00 AM IST
  workflow_dispatch:        # manual "Run" button ke liye

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_news.py
      - run: python scripts/rank_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Save news to repo
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/
          git commit -m "Daily news $(date -u +%F)" || echo "No changes"
          git push
      - name: Keep schedule alive
        run: gh workflow enable daily.yml || true
        env:
          GH_TOKEN: ${{ github.token }}
